<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<style>
body { width: 380px; font-family: sans-serif; font-size: 13px; }
textarea { width: 100%; height: 100px; }
button { margin: 4px 4px 4px 0; }
button:disabled { opacity: 0.5; }
#chunks { white-space: pre-wrap; max-height: 120px; overflow-y: auto; border: 1px solid #ccc; padding: 4px; }
#status { color: #555; min-height: 1.2em; }
fieldset { margin: 6px 0; }
input[type="text"] { width: 100%; box-sizing: border-box; }
</style>
</head>
<body>
<label>Server <input id="server" value="http://127.0.0.1:8000" size="28" /></label>
<div>
<button id="extract">抽出</button>
<button id="preview">プレビュー</button>
<button id="speak">読み上げ</button>
<button id="stop">停止</button>
<label>速度 <input id="speed" value="1.0" size="4" /></label>
</div>
<textarea id="text" placeholder="ここに本文 (抽出ボタンで自動入力)"></textarea>
<fieldset>
<legend>声・LLM</legend>
<label>声 <select id="voice"><option value="auto">auto</option></select></label>
<label>LLM <select id="model"></select></label>
<div>
<input type="file" id="ref_audio" accept="audio/*" />
<input type="text" id="ref_text" placeholder="リファレンス音声の書き起こし" />
<button id="register">声を登録</button>
</div>
</fieldset>
<div id="status"></div>
<div id="chunks"></div>
<script src="popup.js"></script>
</body>
</html>
