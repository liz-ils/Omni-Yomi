<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #1a1a1a;
  --muted: #6b7280;
  --border: #e5e7eb;
  --accent: #2563eb;
  --accent-fg: #ffffff;
  --card: #f9fafb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111827;
    --fg: #f3f4f6;
    --muted: #9ca3af;
    --border: #374151;
    --accent: #3b82f6;
    --accent-fg: #ffffff;
    --card: #1f2937;
  }
}
* { box-sizing: border-box; }
body {
  width: 400px;
  margin: 0;
  padding: 12px;
  font-family: "Segoe UI", "Hiragino Sans", sans-serif;
  font-size: 13px;
  background: var(--bg);
  color: var(--fg);
}
h1 { font-size: 15px; margin: 0 0 8px; }
.row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
button {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--fg);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
input[type="text"], textarea, select {
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px;
}
textarea { width: 100%; height: 110px; resize: vertical; }
select { max-width: 160px; }
.card {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px;
  margin: 8px 0;
  background: var(--card);
}
.card legend { padding: 0 6px; color: var(--muted); font-size: 12px; }
#status {
  min-height: 1.4em;
  margin: 6px 0;
  padding: 6px 8px;
  border-radius: 8px;
  background: var(--card);
  color: var(--muted);
}
#chunks {
  white-space: pre-wrap;
  max-height: 130px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px;
  font-size: 12px;
}
label.small { display: flex; gap: 4px; align-items: center; color: var(--muted); }
input[type="file"] { max-width: 100%; }
</style>
</head>
<body>
<h1>Omni-Yomi</h1>
<div class="row">
<label class="small">Server <input type="text" id="server" value="http://127.0.0.1:8000" size="22" /></label>
</div>
<div class="row">
<button id="extract">抽出</button>
<button id="preview">プレビュー</button>
<button id="speak" class="primary">読み上げ</button>
<button id="stop">停止</button>
<label class="small">速度 <input type="text" id="speed" value="1.0" size="3" /></label>
<label class="small"><input id="use_llm" type="checkbox" /> LLM読み付け</label>
</div>
<textarea id="text" placeholder="ここに本文 (抽出ボタンで自動入力)"></textarea>
<fieldset class="card">
<legend>声・LLM</legend>
<div class="row">
<label class="small">声 <select id="voice"><option value="auto">auto</option></select></label>
<label class="small">LLM <select id="model"></select></label>
</div>
<div class="row">
<input type="file" id="ref_audio" accept="audio/*" />
</div>
<div class="row">
<input type="text" id="ref_text" placeholder="リファレンス音声の書き起こし" style="flex:1" />
<button id="register">声を登録</button>
</div>
</fieldset>
<div id="status"></div>
<div id="chunks"></div>
<script src="popup.js"></script>
</body>
</html>
