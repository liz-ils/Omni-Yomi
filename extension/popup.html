<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<style>
body { width: 360px; font-family: sans-serif; font-size: 13px; }
textarea { width: 100%; height: 120px; }
button { margin: 4px 4px 4px 0; }
#chunks { white-space: pre-wrap; max-height: 160px; overflow-y: auto; border: 1px solid #ccc; padding: 4px; }
#status { color: #555; min-height: 1.2em; }
</style>
</head>
<body>
<label>Server <input id="server" value="http://127.0.0.1:8000" size="24" /></label>
<label>速度 <input id="speed" value="1.0" size="4" /></label>
<div>
<button id="extract">抽出</button>
<button id="preview">プレビュー</button>
<button id="speak">読み上げ</button>
</div>
<textarea id="text" placeholder="ここに本文 (抽出ボタンで自動入力)"></textarea>
<div id="status"></div>
<div id="chunks"></div>
<audio id="player" controls style="width:100%"></audio>
<script src="popup.js"></script>
</body>
</html>
