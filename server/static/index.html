<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Omni-Yomi</title>
<style>
body { max-width: 720px; margin: 16px auto; font-family: sans-serif; font-size: 14px; }
textarea { width: 100%; height: 160px; }
button { margin: 4px 4px 4px 0; }
#chunks { white-space: pre-wrap; max-height: 240px; overflow-y: auto; border: 1px solid #ccc; padding: 6px; }
#status { color: #555; min-height: 1.2em; }
</style>
</head>
<body>
<h1>Omni-Yomi</h1>
<fieldset>
<legend>声 (ボイスクローン)</legend>
<label>声 <select id="voice"><option value="auto">auto</option></select></label>
<input type="file" id="ref_audio" accept="audio/*" />
<input id="ref_text" placeholder="リファレンス音声の書き起こし" size="36" />
<button id="register">声を登録</button>
</fieldset>
<div>
<button id="preview">プレビュー</button>
<button id="speak">読み上げ</button>
<label>速度 <input id="speed" value="1.0" size="4" /></label>
<label><input id="use_llm" type="checkbox" /> LLM読み付け</label>
</div>
<textarea id="text" placeholder="ここに本文を貼り付け (拡張機能の抽出ボタンでも入力可)"></textarea>
<div id="status"></div>
<div id="chunks"></div>
<audio id="player" controls style="width:100%"></audio>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const setStatus = (msg) => { $("status").textContent = msg; };

async function refreshVoices() {
  try {
    const data = await (await fetch("/voices")).json();
    const sel = $("voice");
    sel.innerHTML = "";
    data.voices.forEach((v) => {
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      sel.appendChild(opt);
    });
  } catch (e) {
    setStatus("voices error: " + e.message);
  }
}
refreshVoices();

$("register").addEventListener("click", async () => {
  setStatus("registering...");
  try {
    const form = new FormData();
    form.append("ref_audio", $("ref_audio").files[0]);
    form.append("ref_text", $("ref_text").value);
    const r = await fetch("/voices/register", { method: "POST", body: form });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    await refreshVoices();
    $("voice").value = data.voice;
    setStatus("registered: " + data.voice);
  } catch (e) {
    setStatus("register error: " + e.message);
  }
});

$("preview").addEventListener("click", async () => {
  setStatus("previewing...");
  try {
    const r = await fetch("/normalize/preview", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: $("text").value, use_llm: $("use_llm").checked }),
    });
    const data = await r.json();
    $("chunks").textContent = data.chunks
      .map((c) => `[${c.kind}/${c.lang}] ${c.spoken}`)
      .join("\n");
    setStatus(`preview: ${data.chunks.length} chunks`);
  } catch (e) {
    setStatus("preview error: " + e.message);
  }
});

$("speak").addEventListener("click", async () => {
  setStatus("synthesizing...");
  try {
    const r = await fetch("/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text: $("text").value,
        speed: parseFloat($("speed").value) || 1.0,
        use_llm: $("use_llm").checked,
        voice: $("voice").value,
      }),
    });
    const blob = await r.blob();
    $("player").src = URL.createObjectURL(blob);
    await $("player").play();
    setStatus("playing");
  } catch (e) {
    setStatus("speak error: " + e.message);
  }
});
</script>
</body>
</html>
